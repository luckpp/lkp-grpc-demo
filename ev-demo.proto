syntax = "proto3";

package evdemo;
option csharp_namespace = "EvDemo";

message CarRequest {
  string car_id = 1;
}

message CarStatusResponse {
  string car_id = 1;
  int32 battery_percentage = 2;
  string charging_status = 3;
  int32 estimated_remaining_range_km = 4;
}

message CarLocationUpdate {
  double latitude = 1;
  double longitude = 2;
  string timestamp_utc = 3;
}

service EvCarService {
  rpc GetCarStatus (CarRequest) returns (CarStatusResponse);
  rpc GetCarLocationRealTime (CarRequest) returns (stream CarLocationUpdate);
}

